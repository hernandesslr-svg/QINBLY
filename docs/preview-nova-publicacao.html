<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QINBLY — Prévia Nova publicação</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#111;font-family:Arial,sans-serif}.phone{max-width:420px;height:min(860px,100dvh);margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 8px 35px #0002}.screen{flex:1;overflow:auto;padding:22px 16px}.top{display:flex;align-items:center;gap:16px;font-size:21px;font-weight:700;margin-bottom:28px}.top small{margin-left:auto;font-size:15px}.preview{display:flex;gap:12px}.photo{width:85px;height:112px;border-radius:11px;background:linear-gradient(145deg,#53678a,#d69b73);display:grid;place-items:center;color:white;font-size:12px;text-align:center}.caption{border:1px solid #999;border-radius:13px;flex:1;min-height:112px;padding:17px;font-size:17px}.line{border-top:1px solid #e5e5e5;margin:18px 0}.item{display:flex;align-items:center;gap:16px;min-height:55px;font-size:17px}.symbol{width:24px;text-align:center}.chevron{margin-left:auto;color:#aaa}.sub{font-size:13px;color:#777;margin-top:4px}.toggle{margin-left:auto;width:48px;height:27px;border-radius:30px;background:#2387e5;padding:3px}.toggle:after{content:'';display:block;background:white;width:21px;height:21px;border-radius:50%;margin-left:auto}.toggle.off{background:#ccc}.toggle.off:after{margin-left:0}.bottom{padding:12px 16px 20px;background:white;border-top:1px solid #eee}.publish{background:#111;color:white;border:0;border-radius:28px;width:100%;height:54px;font-size:17px;font-weight:700}.hint{text-align:center;color:#777;font-size:12px;margin:8px}</style></head><body><div class="phone"><main class="screen"><div class="top"><span>‹</span><span>Nova publicação</span><small>Editar</small></div><div class="preview"><div class="photo">Prévia da foto</div><div class="caption">Transformers</div></div><div class="line"></div><div class="item"><span class="symbol">♙</span>Marcar pessoas<span class="chevron">›</span></div><div class="item"><span class="symbol">◎</span>Adicionar localização<span class="chevron">›</span></div><div class="item"><span class="symbol">♪</span>Adicionar música<span class="chevron">›</span></div><div class="line"></div><div class="item"><span class="symbol">♟</span><div>Público<div class="sub">Todos podem ver sua publicação</div></div><span class="chevron">›</span></div><div class="item"><span class="symbol">▢</span>Permitir comentários<span class="toggle"></span></div><div class="item"><span class="symbol">↗</span>Permitir compartilhamento<span class="toggle"></span></div><div class="item"><span class="symbol">↓</span>Salvar no dispositivo<span class="toggle off"></span></div><div class="item">Voltar à edição</div></main><footer class="bottom"><button class="publish">➤ &nbsp; Publicar</button></footer></div></body></html>
