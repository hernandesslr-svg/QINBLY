name: Install final enhanced QINBLY profile frames
on:
  push:
    branches: [main]
    paths:
      - 'qinbly_molduras_brilho_png.zip'
      - '.github/workflows/install-qinbly-frames.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow for lossless transparent-margin normalization
        run: python -m pip install Pillow
      - name: Validate and extract ten transparent PNG assets
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import struct, re, io
          from PIL import Image
          src=Path('qinbly_molduras_brilho_png.zip')
          target=Path('app/src/main/res/drawable-nodpi')
          expected={'rosa_neon','azul_eletrico','realeza','galaxia','fogo','cristal','romantica','dourada','esmeralda','prateada'}
          with ZipFile(src) as archive:
            found={}
            for entry in archive.namelist():
              name=Path(entry).name
              match=re.fullmatch(r'qinbly_frame_([a-z_]+)\.png',name)
              if not match: continue
              key=match.group(1)
              assert key in expected and key not in found, name
              data=archive.read(entry)
              assert data[:8]==bytes.fromhex('89504e470d0a1a0a'),name
              width,height=struct.unpack('>II',data[16:24])
              assert width>=128 and height>=128,(name,width,height)
              assert data[25]==6, 'Expected RGBA PNG: '+name
              image=Image.open(io.BytesIO(data)).convert('RGBA')
              alpha=image.getchannel('A')
              bounds=alpha.point(lambda a: 255 if a >= 8 else 0).getbbox()
              assert bounds, 'Empty artwork: '+name
              artwork=image.crop(bounds)
              side=max(artwork.size)
              canvas=Image.new('RGBA',(side,side),(0,0,0,0))
              canvas.alpha_composite(artwork,((side-artwork.width)//2,(side-artwork.height)//2))
              canvas=canvas.resize((700,700),Image.Resampling.LANCZOS)
              output=io.BytesIO()
              canvas.save(output,format='PNG',optimize=True)
              found[key]=output.getvalue()
              print(name,'artwork bounds',bounds,'normalized to 700x700')
          assert set(found)==expected, 'Missing: '+str(expected-set(found))
          target.mkdir(parents=True,exist_ok=True)
          for key,data in found.items():
            (target/('qinbly_frame_'+key+'.png')).write_bytes(data)
          print('Installed',len(found),'PNG frames')
          PY
      - name: Commit installed frame assets to main
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/res/drawable-nodpi/qinbly_frame_*.png
          if ! git diff --cached --quiet; then
            git commit -m "Replace old frames with final enhanced transparent PNGs"
            git push origin HEAD:main
          fi
