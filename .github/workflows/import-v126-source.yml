name: Import missing QINBLY v126 source files
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-v126-source.yml'
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import missing database migrations and project references
        shell: bash
        run: |
          set -euo pipefail
          test -s QINBLY-projeto-v126.zip
          unzip -tq QINBLY-projeto-v126.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          wanted = {
            'BACKEND/db/migrations/010_blocks_reports_moderation.sql',
            'SUPABASE/00_base_schema.sql',
            'SUPABASE/03_community_safety.sql',
            'SUPABASE/04_saves_reposts.sql',
            'SUPABASE/05_social_features.sql',
            'SUPABASE/06_single_profile_photo.sql',
            'SUPABASE/07_communities.sql',
            'SUPABASE/08_comment_edit.sql',
            'SUPABASE/09_chat_extras.sql',
            'SUPABASE/10_stickers_live.sql',
            'SUPABASE/11_stories_notes.sql',
            'SUPABASE/README.md',
            'PADRONIZACAO-ACOES.md',
            'COMUNIDADE-E-MODERACAO.md',
            'IDENTIDADE-VISUAL.md',
            'RENOMEACAO-QINBLY.md',
            'PENDENTES-APROVADOS.md',
          }
          with ZipFile('QINBLY-projeto-v126.zip') as archive:
            names = set(archive.namelist())
            missing = wanted - names
            if missing:
              raise SystemExit(f'Missing from ZIP: {sorted(missing)}')
            for name in sorted(wanted):
              target = Path(name)
              if target.exists():
                print(f'Preserved existing: {name}')
                continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(name))
              print(f'Imported: {name}')
          PY
      - name: Commit imported sources
        shell: bash
        run: |
          set -euo pipefail
          git add BACKEND/db/migrations SUPABASE '*.md'
          if git diff --cached --quiet; then
            echo "All required source files already tracked."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import missing database migrations and project references from v126 archive'
          git push
