name: Repair QINBLY OTA release asset (no APK build)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ota-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-ota-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Rename existing APK asset to lowercase for OTA validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq '.tagName')"
          echo "Repairing OTA filename for release: $tag"
          mkdir -p /tmp/qinbly-ota
          gh release download "$tag" --pattern 'QINBLY-release.apk' --dir /tmp/qinbly-ota
          test -s /tmp/qinbly-ota/QINBLY-release.apk
          mv /tmp/qinbly-ota/QINBLY-release.apk /tmp/qinbly-ota/qinbly-release.apk
          asset_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets[] | select(.name == "QINBLY-release.apk") | .id')"
          test -n "$asset_id"
          gh api -X PATCH "repos/$GH_REPO/releases/assets/$asset_id" -f name='qinbly-release.apk'
          gh release view "$tag" --json assets --jq '.assets[].name'
          echo "OTA lowercase APK asset published without recompiling."
