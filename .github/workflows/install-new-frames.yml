name: Install new QINBLY profile frames
on:
  push:
    paths:
      - '.github/workflows/install-new-frames.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace legacy frames with 25 individual PNGs
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, re
          root=pathlib.Path("app/src/main/res/drawable-nodpi")
          for p in root.glob("qinbly_frame_*.png"): p.unlink()
          paths=[]
          for part in (1,2,3):
              with zipfile.ZipFile(f"QINBLY_molduras_parte_{part}.zip") as z:
                  for member in z.namelist():
                      if not re.fullmatch(r"app/src/main/res/drawable-nodpi/qinbly_frame_\d+\.png",member): raise ValueError(member)
                      z.extract(member)
                      paths.append(pathlib.Path(member).stem)
          assert len(paths)==25 and len(set(paths))==25
          source=pathlib.Path("app/src/main/java/app/vybora/android/MainActivity.kt")
          code=source.read_text()
          start=code.index("    val frames = intArrayOf(",code.index("private fun QiblyAnimatedFrame"))
          end=code.index("    val context =",start)
          code=code[:start]+"    val frames = intArrayOf(\n"+",\n".join("        R.drawable."+p for p in paths)+"\n    )\n"+code[end:]
          names=", ".join('"Moldura '+str(i)+'"' for i in range(1,26))
          code,n=re.subn(r'val frameNames = listOf\([^\n]+\)',"val frameNames = listOf("+names+")",code,count=1)
          assert n==1
          decos=", ".join('"✨"' for _ in range(25))
          code,n=re.subn(r'val frameDecorations = listOf\([^\n]+\)',"val frameDecorations = listOf("+decos+")",code,count=1)
          assert n==1
          start=code.index("        val frameColors = listOf(",code.index("if (framesOpen)"))
          end=code.index("\n        androidx",start)
          code=code[:start]+"        val frameColors = List(25) { Color(0xFF268BFF) }"+code[end:]
          source.write_text(code)
          for part in (1,2,3): pathlib.Path(f"QINBLY_molduras_parte_{part}.zip").unlink()
          PY
      - name: Commit replacement to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Replace cropped frames with 25 transparent individual frames" && git push origin HEAD:main)
