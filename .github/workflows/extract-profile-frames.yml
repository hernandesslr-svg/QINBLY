name: Replace profile frame artwork
on:
  push:
    paths: ['.github/workflows/extract-profile-frames.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Extract ten supplied transparent frames from archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageChops
          import re
          archive=Path('qinbly_android_assets.zip')
          assert archive.exists(), 'Missing supplied frame archive'
          target=Path('app/src/main/res/drawable-nodpi')
          target.mkdir(parents=True,exist_ok=True)
          found={}
          with ZipFile(archive) as z:
            for entry in z.namelist():
              name=Path(entry).name
              if re.fullmatch(r'qinbly_frame_[a-z0-9_]+\.png',name):
                assert name not in found, 'Duplicate frame '+name
                data=z.read(entry)
                im=Image.open(BytesIO(data)).convert('RGBA')
                assert min(im.size)>=128, 'Frame too small '+name
                rgba=list(im.getdata())
                im.putdata([(r,g,b,a*max(0,min(255,(max(r,g,b)-12)*4))//255) for r,g,b,a in rgba])
                hole=Image.new('L',im.size,0)
                radius=int(min(im.size)*0.43)
                cx,cy=im.width//2,im.height//2
                ImageDraw.Draw(hole).ellipse((cx-radius,cy-radius,cx+radius,cy+radius),fill=255)
                im.putalpha(ImageChops.subtract(im.getchannel('A'),hole))
                output=BytesIO()
                im.save(output,format='PNG')
                found[name]=output.getvalue()
          assert len(found)==10, 'Expected 10 PNGs, got '+str(sorted(found))
          for name,data in found.items():
            (target/name).write_bytes(data)
          print('Installed:',', '.join(sorted(found)))
          PY
      - name: Commit replacement assets
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add app/src/main/res/drawable-nodpi/qinbly_frame_*.png
          git diff --cached --quiet || (git commit -m "Replace old frames with independent transparent PNG art" && git push origin HEAD:main)
