name: Replace profile frame artwork
on:
  push:
    paths: ['.github/workflows/extract-profile-frames.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Generate independent transparent decorations
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          import math
          from pathlib import Path
          root=Path('app/src/main/res/drawable-nodpi')
          names=['rosa_neon','azul_eletrico','realeza','galaxia','fogo','cristal','romantica','dourada','esmeralda','prateada']
          colors=['#ff279d','#22bfff','#e9b24b','#a65dff','#ff6321','#7ceaff','#ff79b9','#ffd465','#34d79d','#c4d4ec']
          for idx,(name,color) in enumerate(zip(names,colors)):
            im=Image.new('RGBA',(768,768))
            d=ImageDraw.Draw(im)
            for r,w in [(327,17),(308,8)]:
              d.ellipse((384-r,384-r,384+r,384+r),outline=color,width=w)
            for k in range(16):
              a=k*math.tau/16
              def pt(rad,angle=a): return (384+math.cos(angle)*rad,384+math.sin(angle)*rad)
              if idx==4:
                d.polygon([pt(303,a-.07),pt(369,a+.01),pt(307,a+.08)],fill=color)
              elif idx in (2,5,7,9):
                d.polygon([pt(300),pt(347,a+.07),pt(368),pt(347,a-.07)],fill=color)
              elif idx==8:
                d.ellipse((*[v-19 for v in pt(345)],*[v+19 for v in pt(345)]),fill=color)
              else:
                x,y=pt(343)
                d.ellipse((x-12,y-12,x+12,y+12),fill=color)
            if idx==2:
              d.polygon([(278,104),(301,34),(352,85),(384,14),(416,85),(467,34),(490,104)],fill='#ffd56e')
            if idx==3:
              for x,y,r in [(111,117,32),(648,109,25)]:
                d.ellipse((x-r,y-r,x+r,y+r),fill='#7c4bff',outline='#e5baff',width=6)
            im.save(root/('qinbly_frame_'+name+'.png'))
          PY
      - name: Commit replacement assets
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add app/src/main/res/drawable-nodpi/qinbly_frame_*.png
          git diff --cached --quiet || (git commit -m "Replace old frames with independent transparent PNG art" && git push origin HEAD:main)
