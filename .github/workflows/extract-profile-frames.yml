name: Install QINBLY profile frame PNGs
on:
  push:
    paths:
      - '.github/workflows/extract-profile-frames.yml'
      - 'qinbly_android_assets.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image validation dependency
        run: python -m pip install Pillow
      - name: Validate and replace ten frame PNGs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image
          import re

          archive = Path("qinbly_android_assets.zip")
          target = Path("app/src/main/res/drawable-nodpi")
          assert archive.is_file(), f"Missing archive: {archive}"
          frames = {}
          with ZipFile(archive) as z:
              for member in z.infolist():
                  name = Path(member.filename).name
                  if not re.fullmatch(r"qinbly_frame_[a-z0-9_]+\.png", name):
                      continue
                  assert name not in frames, f"Duplicate frame: {name}"
                  data = z.read(member)
                  with Image.open(BytesIO(data)) as im:
                      im.load()
                      assert im.format == "PNG", f"{name}: not PNG"
                      assert im.mode == "RGBA", f"{name}: expected RGBA"
                      assert im.getpixel((im.width // 2, im.height // 2))[3] == 0, f"{name}: center not transparent"
                  frames[name] = data
          assert len(frames) == 10, f"Expected 10 frames, found {len(frames)}: {sorted(frames)}"
          target.mkdir(parents=True, exist_ok=True)
          for old in target.glob("qinbly_frame_*.png"):
              old.unlink()
          for name, data in frames.items():
              (target / name).write_bytes(data)
          print("Installed 10 validated transparent frames:", ", ".join(sorted(frames)))
          PY
      - name: Commit replacements to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/res/drawable-nodpi
          if ! git diff --cached --quiet; then
            git commit -m "Replace QINBLY profile frames with validated PNGs"
            git push origin HEAD:main
          fi
