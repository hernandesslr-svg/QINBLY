name: Install QINBLY profile frame PNGs
on:
  push:
    paths:
      - '.github/workflows/extract-profile-frames.yml'
      - 'qinbly_android_assets.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace old frame PNGs with the ten approved assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable-nodpi/qinbly_frame_*.png
          unzip -o qinbly_android_assets.zip 'app/src/main/res/drawable-nodpi/qinbly_frame_*.png' -d .
          count=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'qinbly_frame_*.png' | wc -l)
          test "$count" -eq 10
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path("app/src/main/res/drawable-nodpi").glob("qinbly_frame_*.png"):
              with Image.open(p) as im:
                  assert im.mode == "RGBA", f"{p}: expected RGBA"
                  assert im.getpixel((im.width//2, im.height//2))[3] == 0, f"{p}: center must be transparent"
          PY
      - name: Commit replacements to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/res/drawable-nodpi
          if ! git diff --cached --quiet; then
            git commit -m "Replace QINBLY profile frame assets with approved transparent PNGs"
            git push origin HEAD:main
          fi
