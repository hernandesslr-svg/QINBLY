name: QINBLY Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk-release.yml'
      - 'QINBLY-projeto-v48.zip'

permissions:
  contents: write

concurrency:
  group: qinbly-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install original QINBLY launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/icon-assets/qinbly_icon.jpg.b64 > app/src/main/res/drawable-nodpi/qinbly_icon.jpg
          test -s app/src/main/res/drawable-nodpi/qinbly_icon.jpg
          file app/src/main/res/drawable-nodpi/qinbly_icon.jpg

      - name: Prepare uploaded QINBLY v48 sources without modifying the ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s QINBLY-projeto-v48.zip
          unzip -tq QINBLY-projeto-v48.zip
          mkdir -p "$RUNNER_TEMP/qinbly-v48"
          unzip -q QINBLY-projeto-v48.zip -d "$RUNNER_TEMP/qinbly-v48"
          # Locate Kotlin sources even when the uploaded ZIP contains a project root folder.
          ROOT="$RUNNER_TEMP/qinbly-v48"
          echo "Kotlin files found in uploaded V48:"
          find "$ROOT" -type f -name '*.kt' -print | head -80
          TARGET="app/src/main/java/app/qinbly/android"
          mkdir -p "$TARGET"
          for file in MainActivity.kt GoogleSignIn.kt RemoteUiActivity.kt QinblyApi.kt; do
            SOURCE_FILE="$(find "$ROOT" -type f -name "$file" -path '*/src/main/java/*' -print -quit)"
            if [[ -z "$SOURCE_FILE" ]]; then
              echo "::error::Required Kotlin source $file missing from V48 archive."
              exit 1
            fi
            cp "$SOURCE_FILE" "$TARGET/$file"
            echo "Imported $file from ${SOURCE_FILE#"$ROOT"/}"
          done
          # Keep in-app update APK asset filename consistent with GitHub Releases.
          sed -i 's/vybora-release\.apk/QINBLY-release.apk/g' "$TARGET/RemoteUiActivity.kt"
          # Fix OTA asset detection: GitHub publishes QINBLY-release.apk (uppercase).
          # The imported updater incorrectly compares against lowercase qinbly-release.apk.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/qinbly/android/RemoteUiActivity.kt')
          s = p.read_text()
          old = 'asset.optString("name") == "qinbly-release.apk"'
          new = 'asset.optString("name").equals("QINBLY-release.apk", ignoreCase = true)'
          assert s.count(old) == 1, 'Expected exactly one OTA asset filename comparison'
          p.write_text(s.replace(old, new, 1))
          print('OTA fixed: case-insensitive release APK asset lookup.')
          PY
          # Keep OTA download URL validation strict but case-insensitive for the published APK filename.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/qinbly/android/RemoteUiActivity.kt')
          s = p.read_text()
          old = '!uri.path.orEmpty().endsWith("/qinbly-release.apk")'
          new = '!uri.path.orEmpty().endsWith("/QINBLY-release.apk", ignoreCase = true)'
          assert s.count(old) == 1, 'Expected one OTA APK URL validation check'
          p.write_text(s.replace(old, new, 1))
          print('OTA APK URL validation fixed without weakening HTTPS or GitHub checks.')
          PY
          # Profile photo thumbnails must fill their tiles on every account.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          s = p.read_text()
          old = 'contentDescription = "Publicação", modifier = Modifier.fillMaxSize(), contentScale = androidx.compose.ui.layout.ContentScale.Fit)'
          new = 'contentDescription = "Publicação", modifier = Modifier.fillMaxSize(), contentScale = androidx.compose.ui.layout.ContentScale.Crop)'
          assert s.count(old) == 1, 'Profile photo grid image renderer not found exactly once'
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Profile photo grid: images fill each thumbnail, other UI unchanged.')
          PY

      # Remove legacy identifiers from temporary Android sources.
          for file in MainActivity.kt GoogleSignIn.kt RemoteUiActivity.kt QinblyApi.kt; do
            sed -i 's/Vybora/Qinbly/g; s/VYBORA/QINBLY/g; s/vybora/qinbly/g' "$TARGET/$file"
          done
          # v48 references a Material icon unavailable in this project's icon set.
          sed -i 's/Icons.Default.Delete\b/Icons.Default.DeleteForever/g' "$TARGET/MainActivity.kt"
          # The v48 source uses a Compose Foundation API that requires explicit opt-in.
          sed -i '1i@file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)' "$TARGET/MainActivity.kt"
          echo "Prepared v48 Kotlin sources in build workspace; original ZIP remains unchanged."

      - name: Fix duplicate AlertDialog parameters in V48
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines(keepends=True)
          titles=('Bloquear @', 'Contas bloqueadas', 'Bloquear usuário?', 'Excluir conta definitivamente?')
          removed=0
          for i,line in enumerate(lines):
              if 'containerColor = QiblyTheme.card,' not in line:
                  continue
              window=''.join(lines[i+1:i+14])
              if any(title in window for title in titles):
                  lines[i]=''
                  removed+=1
          print(f'V48 duplicate-dialog cleanup matched {removed} candidate(s); continuing to Kotlin compiler validation.')
          p.write_text(''.join(lines))
          print(f'Removed {removed} duplicate AlertDialog containerColor arguments.')
          PY

      - name: Diagnose V48 Compose errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines()
          for n in (3448,3469,5047,5075,5496,5514,7166,7202):
              print(f"=== MainActivity.kt around {n} ===")
              for i in range(max(1,n-22),min(len(lines),n+8)+1):
                  print(f"{i}: {lines[i-1]}")
          PY

      - name: Inspect V48 feed caption and media layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines()
          terms=('caption', 'legenda', 'Legenda', 'post.content', 'post.caption', 'publication.caption', 'contentText')
          matches=[i for i,s in enumerate(lines) if any(t in s for t in terms)]
          print('FEED CAPTION CANDIDATES',len(matches))
          for n in matches[:70]:
              print(f'=== V48 line {n+1} ===')
              for i in range(max(0,n-7),min(len(lines),n+9)):
                  print(f'{i+1}: {lines[i]}')
          PY

      - name: Inspect V48 in-app update implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('app/src/main/java/app/qinbly/android').glob('*.kt'):
              lines=p.read_text().splitlines()
              matches=[i for i,line in enumerate(lines) if any(t in line.lower() for t in ('releases/latest','github.com/repos','github.com/','release.apk','atualizaç','atualizac','updateapk','downloadmanager'))]
              print(f'=== {p.name}: {len(matches)} update matches ===')
              shown=set()
              for n in matches[:32]:
                  for i in range(max(0,n-9),min(len(lines),n+13)):
                      if i not in shown:
                          print(f'{i+1}: {lines[i]}')
                          shown.add(i)
          PY

      - name: Remove post card frames and add edge-to-edge separators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          s = p.read_text()
          start = s.index('private fun QinblyPostCard(')
          anchor = '    Surface('
          idx = s.index(anchor, start)
          old = s[idx:s.index(') {', idx) + 1]
          assert 'shadowElevation = 5.dp' in old and 'RoundedCornerShape(22.dp)' in old, 'Unexpected post card structure'
          new = old.replace('shape = RoundedCornerShape(22.dp)', 'shape = androidx.compose.ui.graphics.RectangleShape').replace('shadowElevation = 5.dp', 'shadowElevation = 0.dp').replace('border = BorderStroke(1.dp, QiblyTheme.border)', 'border = null').replace('Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 6.dp)', 'Modifier.fillMaxWidth().drawBehind { drawLine(color = Color.Gray.copy(alpha = 0.24f), start = androidx.compose.ui.geometry.Offset(0f, size.height), end = androidx.compose.ui.geometry.Offset(size.width, size.height), strokeWidth = 1.dp.toPx()) }')
          assert old != new and 'drawBehind' in new
          s = s[:idx] + new + s[idx + len(old):]
          if 'import androidx.compose.ui.draw.drawBehind' not in s:
              lines = s.splitlines(keepends=True)
              pos = next(i for i, line in enumerate(lines) if line.startswith('import '))
              lines.insert(pos, 'import androidx.compose.ui.draw.drawBehind' + chr(10))
              s = ''.join(lines)
          p.write_text(s)
          print('Post cards removed and edge-to-edge separators added.')
          PY

      - name: Inspect shared video playback in all screens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines()
          keys=('QinblyVideoPoster(', 'ExoPlayer.Builder(', 'PlayerView(', 'playWhenReady', 'MediaItem.fromUri(', 'VideoView(', 'VideoPlayer(', 'isPlaying', 'mediaType == "video"')
          hits=[i for i,line in enumerate(lines) if any(k in line for k in keys)]
          print('VIDEO PLAYBACK REFERENCES:',len(hits))
          for n in hits[:85]:
              print('=== video source line',n+1,'===')
              for i in range(max(0,n-7),min(len(lines),n+16)):
                  print(str(i+1)+': '+lines[i])
          PY

      - name: Inspect profile photo grid layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines()
          keys=('LazyVerticalGrid(', 'GridCells.Fixed(', 'ContentScale.Fit', 'ContentScale.Inside', 'profilePhotos', 'profileMedia', 'Fotos"', 'photoPosts', 'PhotoGrid')
          hits=[i for i,line in enumerate(lines) if any(k in line for k in keys)]
          print('PROFILE GRID REFERENCES:',len(hits))
          for n in hits[:80]:
              print('=== grid source line',n+1,'===')
              for i in range(max(0,n-8),min(len(lines),n+17)):
                  print(str(i+1)+': '+lines[i])
          PY

      - name: Fill shared publication video frame without black sidebars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          s=p.read_text()
          start=s.index('private fun InlineVideoPlayer(')
          end=s.index('\n@Composable',start+1)
          segment=s[start:end]
          old='androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT'
          assert segment.count(old)==2, 'Unexpected inline video resize structure'
          s=s[:start]+segment.replace(old,'androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_ZOOM')+s[end:]
          p.write_text(s)
          print('Shared inline video player now fills the media frame.')
          PY

      - name: Compile Android Kotlin before signing validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure QINBLY_KEYSTORE_BASE64 in repository Actions secrets."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Configure QINBLY_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Configure QINBLY_KEY_ALIAS in repository Actions secrets."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Configure QINBLY_KEY_PASSWORD in repository Actions secrets."; exit 1; }

      - name: Decode and verify original release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qinbly-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/qinbly-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/key-info.txt"
          grep -Fq "4B:E4:31:84:70:0B:86:CF:3A:32:60:4F:74:09:DE:94:17:2A:CB:3A" "$RUNNER_TEMP/key-info.txt" || {
            echo "::error::The configured release keystore is not the original QINBLY OAuth signing key."
            exit 1
          }
          echo "QINBLY_KEYSTORE_PATH=$RUNNER_TEMP/qinbly-release.jks" >> "$GITHUB_ENV"

      - name: Calculate next app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name' 2>/dev/null || echo 'v0.3.39')"
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PATCH=$((PATCH + 1))
          else
            MAJOR=0; MINOR=3; PATCH=40
          fi
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building QINBLY $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build, sign and verify release APK
        env:
          QINBLY_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          QINBLY_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          QINBLY_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/QINBLY-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/QINBLY-release.apk
          CERT_INFO="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/QINBLY-release.apk)"
          printf '%s\n' "$CERT_INFO"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*Signer #1 certificate SHA-1 digest: *//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA1="4be43184700b86cf3a32604f7409de94172acb3a"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || { echo "::error::APK SHA-1 does not match original OAuth signing key."; exit 1; }
          sha256sum release/QINBLY-release.apk | tee release/SHA256SUMS.txt
          echo "Verified APK version $VERSION_NAME with the original signing certificate."

      - name: Publish current APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.VERSION_CODE }}"
          target_commitish: main
          generate_release_notes: false
          make_latest: true
          files: |
            release/QINBLY-release.apk
            release/SHA256SUMS.txt

# Rebuild release after installing ten profile-frame PNG assets.
