      - name: Enlarge camera side icons and bottom filter controls only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          s=p.read_text()
          # The camera side controls all share one composable. Change its icon sizes, not other app icons.
          m=re.search(r'private fun QinblyCameraSideItem\(',s)
          assert m, 'Camera side control component not found'
          start=m.start()
          end=s.find('\n@Composable',start+1)
          assert end>start, 'Cannot isolate camera side control component'
          block=s[start:end]
          pattern=re.compile(r'(Modifier\.size\()(\d+(?:\.\d+)?)\.dp(\))')
          def grow_icon(x):
              n=float(x.group(2))+6
              return x.group(1)+(str(int(n)) if n.is_integer() else str(n))+'.dp'+x.group(3)
          changed,count=pattern.subn(grow_icon,block)
          assert count>=1, 'No icon dimensions in camera side component'
          s=s[:start]+changed+s[end:]
          # Camera's horizontal filter thumbnail circle, scoped to its dedicated label component.
          old='Modifier.size(46.dp).clip(CircleShape)'
          assert s.count(old)>=1, 'Camera filter thumbnail circle not found'
          s=s.replace(old,'Modifier.size(54.dp).clip(CircleShape)',1)
          # Wider camera tool rail so enlarged icons and +3sp labels have room.
          old='Modifier.align(Alignment.TopEnd).padding(top = 52.dp).width(140.dp)'
          assert s.count(old)==1, 'Camera tool rail not found'
          s=s.replace(old,'Modifier.align(Alignment.TopEnd).padding(top = 52.dp).width(170.dp)',1)
          p.write_text(s)
          print(f'Camera side component: {count} icon dimensions +6dp; filter circles 46->54dp; tool rail 140->170dp. Existing +3sp font adjustment remains.')
          PY

      - name: Inspect editor side controls and offsets for requested resizing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('app/src/main/java/app/qinbly/android/MainActivity.kt').read_text().splitlines()
          for i,line in enumerate(lines):
              if i>10800 and any(x in line for x in ('QinblyCameraSideItem(', 'sideExpanded', 'padding(top =', 'width(140.dp)', 'QinblyColorFilterNames', 'Avançar')):
                  print('=== EDITOR',i+1,'===')
                  for j in range(max(0,i-5),min(len(lines),i+7)):
                      print(f'{j+1}: {lines[j]}')
          PY

      - name: Compile Android Kotlin before signing validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -w /workspace \
            -v "$ANDROID_HOME:$ANDROID_HOME" -e ANDROID_HOME -e ANDROID_SDK_ROOT \
            -e GRADLE_USER_HOME=/workspace/.gradle-ci -e HOME=/workspace \
            gradle:8.9-jdk17 gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure QINBLY_KEYSTORE_BASE64 in repository Actions secrets."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Configure QINBLY_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Configure QINBLY_KEY_ALIAS in repository Actions secrets."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Configure QINBLY_KEY_PASSWORD in repository Actions secrets."; exit 1; }

      - name: Decode and verify original release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qinbly-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/qinbly-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/key-info.txt"
          grep -Fq "4B:E4:31:84:70:0B:86:CF:3A:32:60:4F:74:09:DE:94:17:2A:CB:3A" "$RUNNER_TEMP/key-info.txt" || {
            echo "::error::The configured release keystore is not the original QINBLY OAuth signing key."
            exit 1
          }
          echo "QINBLY_KEYSTORE_PATH=$RUNNER_TEMP/qinbly-release.jks" >> "$GITHUB_ENV"

      - name: Calculate next app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name' 2>/dev/null || echo 'v0.3.39')"
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PATCH=$((PATCH + 1))
          else
            MAJOR=0; MINOR=3; PATCH=40
          fi
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building QINBLY $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build, sign and verify release APK
        env:
          QINBLY_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          QINBLY_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          QINBLY_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -w /workspace \
            -v "$ANDROID_HOME:$ANDROID_HOME" -e ANDROID_HOME -e ANDROID_SDK_ROOT \
            -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
            -e QINBLY_KEYSTORE_PATH -e QINBLY_KEYSTORE_PASSWORD -e QINBLY_KEY_ALIAS -e QINBLY_KEY_PASSWORD \
            -e GRADLE_USER_HOME=/workspace/.gradle-ci -e HOME=/workspace \
            gradle:8.9-jdk17 gradle --no-daemon :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/QINBLY-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/QINBLY-release.apk
          CERT_INFO="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/QINBLY-release.apk)"
          printf '%s\n' "$CERT_INFO"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*Signer #1 certificate SHA-1 digest: *//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA1="4be43184700b86cf3a32604f7409de94172acb3a"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || { echo "::error::APK SHA-1 does not match original OAuth signing key."; exit 1; }
          sha256sum release/QINBLY-release.apk | tee release/SHA256SUMS.txt
          echo "Verified APK version $VERSION_NAME with the original signing certificate."

      - name: Publish current APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.VERSION_CODE }}"
          target_commitish: main
          generate_release_notes: false
          make_latest: true
          files: |
            release/QINBLY-release.apk
            release/SHA256SUMS.txt

