      - name: Fix V112 split-screen early returns without deleting UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines(keepends=True)
          expected=(9972,10410,10512,10609)
          matches=[n for n in expected if n <= len(lines) and lines[n-1].strip()=='return']
          if len(matches)==len(expected):
              for n in matches:
                  lines[n-1]=lines[n-1].replace('return','return@QinblySplit',1)
          else:
              print('V112 source layout differs from V108; skipping obsolete line-number patch and letting Kotlin compiler diagnose actual errors.')
          p.write_text(''.join(lines))
          print('Replaced four invalid nonlocal returns with labeled split exits; all UI blocks retained.')
          PY

