      - name: Prepare Gradle 8.9 Docker image from container registry
        shell: bash
        run: |
          set -euo pipefail
          docker pull gradle:8.9-jdk17

      - name: Route Kotlin compiler artifact to dedicated Maven mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          s = p.read_text()
          plugin, dependency = s.split('dependencyResolutionManagement {', 1)
          kotlin_repo = '''maven("https://maven.aliyun.com/repository/central") {
              content { includeGroup("org.jetbrains.kotlin") }
          }'''
          dependency = dependency.replace('repositories {', 'repositories {\n        ' + kotlin_repo, 1)
          p.write_text(plugin + 'dependencyResolutionManagement {' + dependency)
          print(p.read_text())
          PY

      - name: Diagnose V112 Kotlin source errors
