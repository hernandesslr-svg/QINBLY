name: QINBLY Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk-release.yml'
      - 'QINBLY-projeto-v42.zip'

permissions:
  contents: write

concurrency:
  group: qinbly-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install original QINBLY launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/icon-assets/qinbly_icon.jpg.b64 > app/src/main/res/drawable-nodpi/qinbly_icon.jpg
          test -s app/src/main/res/drawable-nodpi/qinbly_icon.jpg
          file app/src/main/res/drawable-nodpi/qinbly_icon.jpg

      - name: Prepare uploaded QINBLY v42 sources without modifying the ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s QINBLY-projeto-v42.zip
          unzip -tq QINBLY-projeto-v42.zip
          mkdir -p "$RUNNER_TEMP/qinbly-v42"
          unzip -q QINBLY-projeto-v42.zip -d "$RUNNER_TEMP/qinbly-v42"
          # Locate Kotlin sources even when the uploaded ZIP contains a project root folder.
          ROOT="$RUNNER_TEMP/qinbly-v42"
          echo "Kotlin files found in uploaded V42:"
          find "$ROOT" -type f -name '*.kt' -print | head -80
          TARGET="app/src/main/java/app/qinbly/android"
          mkdir -p "$TARGET"
          for file in MainActivity.kt GoogleSignIn.kt RemoteUiActivity.kt QinblyApi.kt; do
            SOURCE_FILE="$(find "$ROOT" -type f -name "$file" -path '*/src/main/java/*' -print -quit)"
            if [[ -z "$SOURCE_FILE" ]]; then
              echo "::error::Required Kotlin source $file missing from V42 archive."
              exit 1
            fi
            cp "$SOURCE_FILE" "$TARGET/$file"
            echo "Imported $file from ${SOURCE_FILE#"$ROOT"/}"
          done
          # Match the in-app updater to the public QINBLY APK filename.
          sed -i 's/vybora-release\.apk/QINBLY-release.apk/g' "$TARGET/RemoteUiActivity.kt"
          # Remove legacy identifiers from temporary Android sources.
          for file in MainActivity.kt GoogleSignIn.kt RemoteUiActivity.kt QinblyApi.kt; do
            sed -i 's/Vybora/Qinbly/g; s/VYBORA/QINBLY/g; s/vybora/qinbly/g' "$TARGET/$file"
          done
          # v42 references a Material icon unavailable in this project's icon set.
          sed -i 's/Icons.Default.Delete\b/Icons.Default.DeleteForever/g' "$TARGET/MainActivity.kt"
          # The v42 source uses a Compose Foundation API that requires explicit opt-in.
          sed -i '1i@file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)' "$TARGET/MainActivity.kt"
          echo "Prepared v42 Kotlin sources in build workspace; original ZIP remains unchanged."

      - name: Fix duplicate AlertDialog parameters in V42
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines(keepends=True)
          titles=('Bloquear @', 'Contas bloqueadas', 'Bloquear usuário?', 'Excluir conta definitivamente?')
          removed=0
          for i,line in enumerate(lines):
              if 'containerColor = QiblyTheme.card,' not in line:
                  continue
              window=''.join(lines[i+1:i+14])
              if any(title in window for title in titles):
                  lines[i]=''
                  removed+=1
          assert removed == 4, f'Expected four duplicate AlertDialog containerColor arguments; found {removed}'
          p.write_text(''.join(lines))
          print(f'Removed {removed} duplicate AlertDialog containerColor arguments.')
          PY

      - name: Diagnose V42 Compose errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines()
          for n in (3448,3469,5047,5075,5496,5514,7166,7202):
              print(f"=== MainActivity.kt around {n} ===")
              for i in range(max(1,n-22),min(len(lines),n+8)+1):
                  print(f"{i}: {lines[i-1]}")
          PY

      - name: Compile Android Kotlin before signing validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure QINBLY_KEYSTORE_BASE64 in repository Actions secrets."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Configure QINBLY_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Configure QINBLY_KEY_ALIAS in repository Actions secrets."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Configure QINBLY_KEY_PASSWORD in repository Actions secrets."; exit 1; }

      - name: Decode and verify original release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qinbly-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/qinbly-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/key-info.txt"
          grep -Fq "4B:E4:31:84:70:0B:86:CF:3A:32:60:4F:74:09:DE:94:17:2A:CB:3A" "$RUNNER_TEMP/key-info.txt" || {
            echo "::error::The configured release keystore is not the original QINBLY OAuth signing key."
            exit 1
          }
          echo "QINBLY_KEYSTORE_PATH=$RUNNER_TEMP/qinbly-release.jks" >> "$GITHUB_ENV"

      - name: Calculate next app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name' 2>/dev/null || echo 'v0.3.39')"
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PATCH=$((PATCH + 1))
          else
            MAJOR=0; MINOR=3; PATCH=40
          fi
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building QINBLY $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build, sign and verify release APK
        env:
          QINBLY_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          QINBLY_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          QINBLY_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/QINBLY-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/QINBLY-release.apk
          CERT_INFO="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/QINBLY-release.apk)"
          printf '%s\n' "$CERT_INFO"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*Signer #1 certificate SHA-1 digest: *//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA1="4be43184700b86cf3a32604f7409de94172acb3a"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || { echo "::error::APK SHA-1 does not match original OAuth signing key."; exit 1; }
          sha256sum release/QINBLY-release.apk | tee release/SHA256SUMS.txt
          echo "Verified APK version $VERSION_NAME with the original signing certificate."

      - name: Publish current APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.VERSION_CODE }}"
          target_commitish: main
          generate_release_notes: false
          make_latest: true
          files: |
            release/QINBLY-release.apk
            release/SHA256SUMS.txt

# Rebuild release after installing ten profile-frame PNG assets.
