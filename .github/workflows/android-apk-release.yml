name: QINBLY Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk-release.yml'
      - 'QINBLY-projeto-v112.zip'

permissions:
  contents: write

concurrency:
  group: qinbly-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install original QINBLY launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/icon-assets/qinbly_icon.jpg.b64 > app/src/main/res/drawable-nodpi/qinbly_icon.jpg
          test -s app/src/main/res/drawable-nodpi/qinbly_icon.jpg
          file app/src/main/res/drawable-nodpi/qinbly_icon.jpg

      - name: Prepare uploaded QINBLY v112 sources without modifying the ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s QINBLY-projeto-v112.zip
          unzip -tq QINBLY-projeto-v112.zip
          mkdir -p "$RUNNER_TEMP/qinbly-v112"
          unzip -q QINBLY-projeto-v112.zip -d "$RUNNER_TEMP/qinbly-v112"
          # Locate Kotlin sources even when the uploaded ZIP contains a project root folder.
          ROOT="$RUNNER_TEMP/qinbly-v112"
          echo "Kotlin files found in uploaded V48:"
          find "$ROOT" -type f -name '*.kt' -print | head -80
          TARGET="app/src/main/java/app/qinbly/android"
          mkdir -p "$TARGET"
          for file in MainActivity.kt PhotoVideoEditor.kt GoogleSignIn.kt RemoteUiActivity.kt QinblyApi.kt; do
            SOURCE_FILE="$(find "$ROOT" -type f -name "$file" -path '*/src/main/java/*' -print -quit)"
            if [[ -z "$SOURCE_FILE" ]]; then
              echo "::error::Required Kotlin source $file missing from V112 archive."
              exit 1
            fi
            cp "$SOURCE_FILE" "$TARGET/$file"
            echo "Imported $file from ${SOURCE_FILE#"$ROOT"/}"
          done
          # Keep in-app update APK asset filename consistent with GitHub Releases.
          sed -i 's/vybora-release\.apk/QINBLY-release.apk/g' "$TARGET/RemoteUiActivity.kt"
          sed -i 's/contentDescription = "Publicação", modifier = Modifier.fillMaxSize(), contentScale = androidx.compose.ui.layout.ContentScale.Fit)/contentDescription = "Publicação", modifier = Modifier.fillMaxSize(), contentScale = androidx.compose.ui.layout.ContentScale.Crop)/' "$TARGET/MainActivity.kt"
          # Fix OTA asset detection: GitHub publishes QINBLY-release.apk (uppercase).
          # The imported updater incorrectly compares against lowercase qinbly-release.apk.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/qinbly/android/RemoteUiActivity.kt')
          s = p.read_text()
          old = 'asset.optString("name") == "qinbly-release.apk"'
          new = 'asset.optString("name").equals("QINBLY-release.apk", ignoreCase = true)'
          assert s.count(old) == 1, 'Expected exactly one OTA asset filename comparison'
          p.write_text(s.replace(old, new, 1))
          print('OTA fixed: case-insensitive release APK asset lookup.')
          PY
          # Keep OTA download URL validation strict but case-insensitive for the published APK filename.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/qinbly/android/RemoteUiActivity.kt')
          s = p.read_text()
          old = '!uri.path.orEmpty().endsWith("/qinbly-release.apk")'
          new = '!uri.path.orEmpty().endsWith("/QINBLY-release.apk", ignoreCase = true)'
          assert s.count(old) == 1, 'Expected one OTA APK URL validation check'
          p.write_text(s.replace(old, new, 1))
          print('OTA APK URL validation fixed without weakening HTTPS or GitHub checks.')
          PY
          # Remove legacy identifiers from temporary Android sources.
          for file in MainActivity.kt GoogleSignIn.kt RemoteUiActivity.kt QinblyApi.kt; do
            sed -i 's/Vybora/Qinbly/g; s/VYBORA/QINBLY/g; s/vybora/qinbly/g' "$TARGET/$file"
          done
          # v48 references a Material icon unavailable in this project's icon set.
          sed -i 's/Icons.Default.Delete\b/Icons.Default.DeleteForever/g' "$TARGET/MainActivity.kt"
          # The v48 source uses a Compose Foundation API that requires explicit opt-in.
          sed -i '1i@file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class, androidx.compose.foundation.layout.ExperimentalLayoutApi::class)' "$TARGET/MainActivity.kt"
          echo "Prepared v112 Kotlin sources in build workspace; original ZIP remains unchanged."

      - name: Fix duplicate AlertDialog parameters in V48
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines(keepends=True)
          titles=('Bloquear @', 'Contas bloqueadas', 'Bloquear usuário?', 'Excluir conta definitivamente?')
          removed=0
          for i,line in enumerate(lines):
              if 'containerColor = QiblyTheme.card,' not in line:
                  continue
              window=''.join(lines[i+1:i+14])
              if any(title in window for title in titles):
                  lines[i]=''
                  removed+=1
          print(f'V48 duplicate-dialog cleanup matched {removed} candidate(s); continuing to Kotlin compiler validation.')
          p.write_text(''.join(lines))
          print(f'Removed {removed} duplicate AlertDialog containerColor arguments.')
          PY

      - name: Diagnose V48 Compose errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines()
          for n in (3448,3469,5047,5075,5496,5514,7166,7202):
              print(f"=== MainActivity.kt around {n} ===")
              for i in range(max(1,n-22),min(len(lines),n+8)+1):
                  print(f"{i}: {lines[i-1]}")
          PY

      - name: Inspect V48 feed caption and media layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          lines=p.read_text().splitlines()
          terms=('caption', 'legenda', 'Legenda', 'post.content', 'post.caption', 'publication.caption', 'contentText')
          matches=[i for i,s in enumerate(lines) if any(t in s for t in terms)]
          print('FEED CAPTION CANDIDATES',len(matches))
          for n in matches[:70]:
              print(f'=== V48 line {n+1} ===')
              for i in range(max(0,n-7),min(len(lines),n+9)):
                  print(f'{i+1}: {lines[i]}')
          PY

      - name: Inspect V48 in-app update implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('app/src/main/java/app/qinbly/android').glob('*.kt'):
              lines=p.read_text().splitlines()
              matches=[i for i,line in enumerate(lines) if any(t in line.lower() for t in ('releases/latest','github.com/repos','github.com/','release.apk','atualizaç','atualizac','updateapk','downloadmanager'))]
              print(f'=== {p.name}: {len(matches)} update matches ===')
              shown=set()
              for n in matches[:32]:
                  for i in range(max(0,n-9),min(len(lines),n+13)):
                      if i not in shown:
                          print(f'{i+1}: {lines[i]}')
                          shown.add(i)
          PY

      - name: Remove post card frames and add edge-to-edge separators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/qinbly/android/MainActivity.kt')
          s = p.read_text()
          start = s.index('private fun QinblyPostCard(')
          anchor = '    Surface('
          idx = s.index(anchor, start)
          old = s[idx:s.index(') {', idx) + 1]
          if 'shadowElevation = 5.dp' not in old or 'RoundedCornerShape(22.dp)' not in old:
              print('V77 uses a different post card layout; skipping legacy frame patch.')
              raise SystemExit(0)
          new = old.replace('shape = RoundedCornerShape(22.dp)', 'shape = androidx.compose.ui.graphics.RectangleShape').replace('shadowElevation = 5.dp', 'shadowElevation = 0.dp').replace('border = BorderStroke(1.dp, QiblyTheme.border)', 'border = null').replace('Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 6.dp)', 'Modifier.fillMaxWidth().drawBehind { drawLine(color = Color.Gray.copy(alpha = 0.24f), start = androidx.compose.ui.geometry.Offset(0f, size.height), end = androidx.compose.ui.geometry.Offset(size.width, size.height), strokeWidth = 1.dp.toPx()) }')
          assert old != new and 'drawBehind' in new
          s = s[:idx] + new + s[idx + len(old):]
          if 'import androidx.compose.ui.draw.drawBehind' not in s:
              lines = s.splitlines(keepends=True)
              pos = next(i for i, line in enumerate(lines) if line.startswith('import '))
              lines.insert(pos, 'import androidx.compose.ui.draw.drawBehind' + chr(10))
              s = ''.join(lines)
          p.write_text(s)
          print('Post cards removed and edge-to-edge separators added.')
          PY

      - name: Inspect shared video playback in all screens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
